name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift 6 toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      - name: Show toolchain
        run: swift --version
      - name: Validate repository
        run: ./scripts/validate_repository.sh
